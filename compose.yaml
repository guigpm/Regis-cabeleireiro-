version: "3.8"

services:
  app:
    build:
      context: .
      target: runtime
    image: rr-barbearia:local
    init: true
    restart: unless-stopped
    ports:
      - "${DOCKER_BIND_IP:-127.0.0.1}:${DOCKER_PORT:-4000}:4000"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "4000"
      # Ignora o DB_PATH usado pelo npm start no host: o banco fica no volume.
      DB_PATH: /data/barbearia.sqlite
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-}"
      GOOGLE_REDIRECT_URI: "${GOOGLE_REDIRECT_URI:-}"
    volumes:
      - database:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  database:
    name: "${DOCKER_DATA_VOLUME:-rr-barbearia-data}"
